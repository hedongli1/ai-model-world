name: 同步模型数据

# 这个工作流是整个「发布后不用人管」承诺的发动机。
#
# 它每天两次抓上游、校验、把快照提交回仓库，Vercel 与 EdgeOne 收到 push 后各自重新构建。
# 抓取跑在 GitHub Actions 的境外节点上，因此能访问 Hugging Face——
# 那是补齐参数量与开源许可证的唯一来源，从中国大陆是连不上的。
#
# 精灵图不在这里生成：它是构建期产物，由部署平台的 prebuild 钩子跑。

on:
  schedule:
    # 每天两次。上游 models.dev 的 CI 每小时第 17 分钟跑，我们错开到第 40 分钟，
    # 这样抓到的总是它刚同步完的新数据。
    #
    # 从每小时收回为每天两次（2026-09-18，应用户要求）：
    # 模型发布本来就不是按小时发生的事，实测连着跑两次多数时候只有几个价格
    # 小数点在动；两次快照之间几乎没有可感知差异。每小时的 24 次里约 22 次
    # 是空跑，徒增 Actions 队列占用与 git 历史膨胀，稳定性反而更差（越密越容易
    # 碰上 GitHub 的高负载丢任务窗口）。需要抢时效时手动 Run workflow，
    # 一分钟内跑完。上游 models.dev 的数据仍按其自身节奏更新，不受影响。
    #
    # GitHub 的 cron 走 UTC，这里的 01:40 与 13:40 对应北京时间的 09:40 与 21:40。
    - cron: '40 1,13 * * *'
  workflow_dispatch:

# 只申请所需的最小权限：contents 用于提交快照，issues 用于同步失败时开 issue 留痕
permissions:
  contents: write
  issues: write
  # 需要它才能在快照提交后 dispatch 部署工作流。
  # 实测缺失时报 `HTTP 403: Resource not accessible by integration`。
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 条件请求缓存。命中 ETag 时上游返回 304，零流量。
      - name: 恢复 HTTP 缓存
        uses: actions/cache@v6
        with:
          path: data/.cache
          key: sync-http-cache-${{ github.run_id }}
          restore-keys: sync-http-cache-

      # 管线内建合理性闸门：模型总数骤降、必填字段覆盖率下滑、定价为零或负
      # 都会拒绝写入并以非零退出码结束，此时旧快照原封不动地保留。
      - name: 抓取并归一化
        run: npm run sync

      - name: 提交快照
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "上游无变化，跳过提交"
            # 显式标记「本次没有产生提交」。下游据此决定是否触发重新部署 ——
            # 不能用 git log 反推：无提交时 HEAD 仍是上一次的提交，
            # 拿它和它的父提交比较会一直为真，导致每次空跑都误触发部署。
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交归一化后的快照。data/.cache 与 data/raw 装的是解析之前的上游原始响应，
          # 其中 openrouter.ai 那一条带着 Artificial Analysis 的分数，入库即等于公开再分发
          # （见 docs/DATA.md 的合规章节）。.gitignore 拦了一道，这里用显式 pathspec 再拦一道。
          git add -A -- ':(glob)data/*.json'
          if git diff --cached --name-only | grep -Ev '^data/[^/]+\.json$'; then
            echo "::error::暂存区出现了 data/ 顶层 JSON 以外的文件，拒绝提交"
            exit 1
          fi
          summary=$(node -e "
            const s = require('./data/models.json');
            const alive = s.models.filter(m => !m.retiredAt).length;
            console.log(\`\${s.models.length} 个模型（存活 \${alive}）· \${s.vendors.length} 家厂商\`);
          ")
          git commit -m "chore(data): 同步模型快照 — ${summary}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # 闸门拦截时留下证据，方便回溯是哪一次上游出了问题
      - name: 上传同步报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-report
          path: |
            data/sync-report.json
            data/discovery-pending.json
          if-no-files-found: ignore
          retention-days: 30

      # 快照提交后需要重建站点。但 GITHUB_TOKEN 推送不会触发 push 事件工作流
      # （GitHub 官方限制），所以这里显式 dispatch 部署工作流。
      # 不加这一步，数据每天同步成功、站点却永远停留在旧快照。
      # 只有「本次运行确实提交了快照」才重建站点。
      # 判断依据是上一步的 output，而不是 git log —— 无提交时 HEAD 不变，
      # 用 HEAD~1..HEAD 去比较会永远为真，每次空跑都会白触发一次部署。
      - name: 数据有更新时触发重新部署
        if: success() && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 直接打 API 而不走 gh CLI：少一层封装，缺权限时明确返回 403
          # （缺 actions: write 时报 `Resource not accessible by integration`）
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已触发 deploy.yml 重新部署"

      # 「零维护」承诺失效时必须留下一条看得见的痕迹。
      # 找标题为「数据同步失败」且仍 open 的 issue：有就追加评论，没有就新建——
      # 连续失败不会刷出一堆 issue，修好之后手动关掉那一条即可。
      - name: 同步失败时开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '数据同步失败';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 闸门拦截时 sync-report.json 仍会写出（accepted=false）；管线异常终止时可能没有。
            let summary = '本次运行没有产出 data/sync-report.json，多半是管线在校验之前就异常终止了，请直接看运行日志。';
            try {
              const report = JSON.parse(fs.readFileSync('data/sync-report.json', 'utf8'));
              const failures = report.failures ?? [];
              const warnings = report.warnings ?? [];
              const sources = Object.entries(report.sources ?? {})
                .filter(([, s]) => s && s.ok === false)
                .map(([k, s]) => `- \`${k}\`：${s.note ?? '失败'}`);
              summary = [
                `- 是否写入快照：${report.accepted ? '是' : '**否（闸门拦截，保留旧快照）**'}`,
                `- 模型总数：${report.counts?.models ?? '?'}`,
                '',
                `**校验失败（${failures.length}）**`,
                ...(failures.length ? failures.map((f) => `- ${f}`) : ['- （无）']),
                '',
                `**校验告警（${warnings.length}）**`,
                ...(warnings.length ? warnings.slice(0, 10).map((w) => `- ${w}`) : ['- （无）']),
                ...(warnings.length > 10 ? [`- …另有 ${warnings.length - 10} 条，见 artifact`] : []),
                '',
                `**抓取失败的源（${sources.length}）**`,
                ...(sources.length ? sources : ['- （无）']),
              ].join('\n');
            } catch (err) {
              summary += `\n\n（读取报告时出错：${String(err)}）`;
            }

            const body = [
              `### 同步失败 · ${new Date().toISOString()}`,
              '',
              `运行链接：${runUrl}`,
              '',
              summary,
              '',
              '完整的 `data/sync-report.json` 与 `data/discovery-pending.json` 在该次运行的 artifact `sync-report` 里。',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已在 issue #${existing.number} 追加评论`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  '数据同步管线（`.github/workflows/sync.yml`）运行失败。',
                  '每次失败都会在这条 issue 下追加一条评论；问题修复、同步恢复后请手动关闭。',
                  '',
                  body,
                ].join('\n'),
              });
              core.info(`已新建 issue #${created.number}`);
            }
